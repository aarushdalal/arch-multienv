# ==============================================================================
# Environment A - Primary Desktop Configuration
# ==============================================================================

# Monitor configuration (Adapts to default connected display)
monitor=,preferred,auto,1.5

# Input settings
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# General layout
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(58c89cee) rgba(2d4d40ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

# Window decoration
decoration {
    rounding = 8
    active_opacity = 0.95
    inactive_opacity = 0.85
    blur {
        enabled = true
        size = 5
        passes = 2
    }
}

# Animations
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = windows, 1, 4, easeOutQuint
    animation = border, 1, 5, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
}

# Dwindle layout specifics
dwindle {
    pseudotile = true
    preserve_split = true
}

# Keybindings
$mainMod = SUPER

bind = $mainMod, Return, exec, ${TERMINAL:-foot}
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, ${FILE_MANAGER:-nautilus}
bind = $mainMod, Space, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, D, exec, ${LAUNCHER:-fuzzel}

# Quick environment switcher binding
bind = $mainMod SHIFT, S, exec, multienv switch environment-b

# Window focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces (1-5)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move to workspace (1-5)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Logout hook
bind = $mainMod SHIFT, M, exec, multienv-logout
