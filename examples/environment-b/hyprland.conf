# ==============================================================================
# Environment B - Minimal / Development Desktop Configuration
# ==============================================================================

# Monitor configuration (Alternative scaling for higher density)
monitor=,preferred,auto,1.25

# Input settings
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# General layout - Tight, compact gaps
general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(82aaffee) rgba(3e4451ee) 45deg
    col.inactive_border = rgba(282c34aa)
    layout = dwindle
}

# Window decoration - Flat minimal aesthetics
decoration {
    rounding = 4
    active_opacity = 0.98
    inactive_opacity = 0.90
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# Animations - Snappy minimal transitions
animations {
    enabled = true
    bezier = snappy, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 2, snappy
    animation = border, 1, 3, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, default
}

# Dwindle layout specifics
dwindle {
    pseudotile = true
    preserve_split = true
}

# Keybindings
$mainMod = SUPER

bind = $mainMod, Return, exec, ${TERMINAL:-foot}
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, ${FILE_MANAGER:-nautilus}
bind = $mainMod, Space, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, D, exec, ${LAUNCHER:-fuzzel}

# Quick environment switcher binding
bind = $mainMod SHIFT, S, exec, multienv switch environment-a

# Window focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces (1-5)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move to workspace (1-5)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Logout hook
bind = $mainMod SHIFT, M, exec, multienv-logout
